<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GAME</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="light">
    <div class="loading">
      <div class="circle"></div>
      <div class="circle"></div>
    </div>
    <nav class="hide">
      <a href="../index.html">Quiz</a>
      <div class="right-nav-items">
        <div id="progress">1/9</div>
        <button id="pause-toggle">
          <i id="pause" class="fa-solid fa-pause"></i>
          <i id="play" class="fa-solid fa-play hide"></i>
        </button>
        <button id="skip-btn"><i class="fa-solid fa-forward"></i></button>
        <button id="theme-toggle">
          <i id="dark" class="fa-solid fa-moon hide"></i>
          <i id="light" class="fa-solid fa-sun"></i>
        </button>
      </div>
    </nav>

    <main class="hide">
      <div class="full container">
        <div class="timer-bar-border">
          <div class="timer-bar-ex"></div>
          <div class="timer">30s</div>
        </div>
        <form id="question-form">
          <div class="title">The question</div>
          <div class="answer-list">
            <button class="answer incorrect" type="submit" data-id="ava-1">
              abc
            </button>
            <button class="answer correct" type="submit" data-id="ava-1">
              abc
            </button>
            <button class="answer" type="submit" data-id="ava-1">abc</button>
            <button class="answer" type="submit" data-id="ava-1">abc</button>
          </div>
        </form>
      </div>
    </main>

    <script src="../js/nav.js"></script>
  </body>
</html>
